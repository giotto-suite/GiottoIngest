[package]
name = 'giottoingest'
publish = false
version = '0.0.1'
edition = '2021'
rust-version = '1.70'

[lib]
crate-type = [ 'rlib', 'staticlib' ]
name = 'giottoingest'

[[bin]]
name = 'document'
path = 'document.rs'

[dependencies]
extendr-api = '0.9.0'
rayon = '1.10'
arrow = { version = '55', default-features = false, features = ['ipc'] }
parquet = { version = '55', default-features = false, features = ['arrow', 'snap', 'zstd', 'lz4', 'flate2', 'brotli'] }

[profile.release]
lto = true
codegen-units = 1
