# R CMD check on macOS, Linux and Windows with a stable Rust toolchain.
# Tests that compare against GiottoDisk skip when it is not installed; the
# Rust-only tests and the build run everywhere.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: release}
          - {os: ubuntu-latest, r: release}
          - {os: windows-latest, r: release}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'Windows' && 'x86_64-pc-windows-gnu' || '' }}
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
          extra-repositories: https://drieslab.r-universe.dev https://giotto-suite.r-universe.dev
      # Installed directly: pak resolves every Suggests, and GiottoDisk is on
      # no repository yet. Its comparison tests skip without it.
      - name: Install dependencies
        shell: Rscript {0}
        run: |
          install.packages(c("tilework", "rcmdcheck", "testthat", "arrow", "terra",
              "dplyr", "rlang", "future"))
          stopifnot(all(c("tilework", "rcmdcheck", "testthat", "arrow") %in%
              rownames(installed.packages())))
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"error"'
