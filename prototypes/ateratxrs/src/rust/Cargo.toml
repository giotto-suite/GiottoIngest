[package]
name = 'ateratxrs'
publish = false
version = '0.1.0'
edition = '2021'
rust-version = '1.65'

[lib]
crate-type = [ 'rlib', 'staticlib' ]
name = 'ateratxrs'

[[bin]]
name = 'document'
path = 'document.rs'

[dependencies]
extendr-api = '0.9.0'
zip = { version = '2', default-features = false }
blosc-src = { version = '0.3', features = ['zstd'] }
half = '2'
serde_json = '1'
arrow = { version = '55', default-features = false }
parquet = { version = '55', default-features = false, features = ['arrow', 'snap'] }

[profile.release]
lto = true
codegen-units = 1
